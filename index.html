<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGP - Portal Corporativo LifeApps</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .auth-bg { background: linear-gradient(135deg, #0f172a 0%, #005691 50%, #3eb049 100%); }
    </style>
</head>
<body class="auth-bg min-h-screen flex flex-col justify-between p-4 text-gray-800">

    <main class="my-auto flex justify-center w-full">
        <div class="bg-white/95 backdrop-blur-md rounded-3xl w-full max-w-md p-6 sm:p-8 shadow-2xl space-y-6 border border-white/20">
            
            <div class="text-center flex flex-col items-center">
                <svg class="h-10 w-auto mb-2" viewBox="0 0 320 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="0" y="55" width="14" height="15" rx="1.5" fill="#3eb049"/>
                    <rect x="22" y="30" width="14" height="40" rx="1.5" fill="#3eb049"/>
                    <rect x="44" y="42" width="14" height="28" rx="1.5" fill="#3eb049"/>
                    <rect x="70" y="5" width="14" height="65" rx="3" fill="#005691"/>
                    <rect x="94" y="28" width="14" height="42" rx="3" fill="#005691"/>
                    <path d="M 125 18 C 125 10 132 5 142 5 L 148 5 L 148 18 L 140 18 C 138 18 137 19 137 21 L 137 28 L 148 28 L 148 40 L 137 40 L 137 70 L 125 70 Z" fill="#005691"/>
                    <path d="M 185 48 C 185 36 175 27 163 27 C 151 27 141 36 141 49 C 141 62 151 71 163 71 C 172 71 180 66 183 58 L 172 54 C 170 58 167 60 163 60 C 157 60 153 56 153 51 L 185 51 Z M 153 43 C 154 39 158 36 163 36 C 168 36 172 39 173 43 Z" fill="#005691"/>
                    <text x="188" y="68" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="34" font-weight="500" fill="#3eb049">apps</text>
                </svg>
                <h2 class="text-xs font-bold text-gray-500 tracking-wider uppercase">Portal & Mini Rede Social Comercial</h2>
            </div>

            <div class="flex rounded-xl bg-gray-100 p-1 text-xs font-bold">
                <button onclick="switchAuthTab('vendedor')" id="auth-tab-vendedor" class="flex-1 py-2 rounded-lg bg-white shadow text-blue-900 transition">Vendedor</button>
                <button onclick="switchAuthTab('admin')" id="auth-tab-admin" class="flex-1 py-2 rounded-lg text-gray-500 hover:text-gray-900 transition">Administrador</button>
            </div>

            <!-- LOGIN VENDEDOR -->
            <form id="form-login-vendedor" onsubmit="handleVendedorLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">E-mail Corporativo</label>
                    <div class="relative">
                        <input type="email" id="login-vendedor-email" required placeholder="vendedor@lifeapps.com.br" value="vendedor@lifeapps.com.br" class="w-full pl-9 pr-3 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <i class="fa-solid fa-envelope absolute left-3 top-3.5 text-gray-400 text-xs"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Senha</label>
                    <div class="relative">
                        <input type="password" id="login-vendedor-senha" required placeholder="123" value="123" class="w-full pl-9 pr-3 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <i class="fa-solid fa-lock absolute left-3 top-3.5 text-gray-400 text-xs"></i>
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs">
                    <label class="flex items-center text-gray-600 font-medium cursor-pointer">
                        <input type="checkbox" id="remember-me" class="w-4 h-4 text-blue-600 rounded mr-2">
                        Lembrar de mim neste dispositivo
                    </label>
                </div>

                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center">
                    Entrar na Rede Social <i class="fa-solid fa-arrow-right-to-bracket ml-2"></i>
                </button>

                <div class="text-center pt-2">
                    <button type="button" onclick="showRegisterScreen()" class="text-xs text-blue-600 font-bold hover:underline">
                        Ainda não tem conta? Criar conta
                    </button>
                </div>
            </form>

            <!-- LOGIN ADMIN -->
            <form id="form-login-admin" onsubmit="handleAdminLogin(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Senha do Administrador</label>
                    <div class="relative">
                        <input type="password" id="login-admin-senha" required placeholder="Digite a senha de administrador..." class="w-full pl-9 pr-3 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <i class="fa-solid fa-shield-halved absolute left-3 top-3.5 text-gray-400 text-xs"></i>
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center">
                    Acessar como Admin <i class="fa-solid fa-user-shield ml-2"></i>
                </button>
            </form>

            <!-- REGISTRO VENDEDOR -->
            <form id="form-register-vendedor" onsubmit="handleVendedorRegister(event)" class="space-y-3 hidden">
                <h3 class="text-xs font-bold text-gray-700 uppercase border-b pb-1">Criar Conta de Vendedor</h3>

                <div>
                    <label class="block text-[11px] font-semibold text-gray-600 uppercase">Nome Completo</label>
                    <input type="text" id="reg-nome" required placeholder="Seu nome" class="w-full p-2 border rounded-lg text-sm">
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-gray-600 uppercase">E-mail Corporativo (@lifeapps.com.br)</label>
                    <input type="email" id="reg-email" required placeholder="nome@lifeapps.com.br" class="w-full p-2 border rounded-lg text-sm">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 uppercase">Senha</label>
                        <input type="password" id="reg-senha" required placeholder="••••••••" class="w-full p-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-gray-600 uppercase">Confirmar Senha</label>
                        <input type="password" id="reg-senha-confirm" required placeholder="••••••••" class="w-full p-2 border rounded-lg text-sm">
                    </div>
                </div>

                <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition">
                    Cadastrar Minha Conta
                </button>

                <div class="text-center pt-1">
                    <button type="button" onclick="hideRegisterScreen()" class="text-xs text-gray-500 font-bold hover:underline">
                        Voltar para o Login
                    </button>
                </div>
            </form>

        </div>
    </main>

    <footer class="text-center text-xs text-white/80 py-2">
        Sistema de Geração de Proposta (SGP) - Nº v4.0 | Desenvolvido por 
        <a href="https://www.linkedin.com/in/rafaelrobertonascimento" target="_blank" rel="noopener noreferrer" class="text-white font-bold underline">
            Rafael Nascimento
        </a>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAokmOx3hiKFy0gLjmLWaQ21KyCmMG2tK4",
            authDomain: "lifeapps-propostas.firebaseapp.com",
            projectId: "lifeapps-propostas",
            storageBucket: "lifeapps-propostas.firebasestorage.app",
            messagingSenderId: "755655431206",
            appId: "1:755655431206:web:0430769d79ef6924ac82e7"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let dbUsers = [];
        let adminPassHash = "lifeapps123";

        function listenSystemSettings() {
            db.collection("settings").doc("config").onSnapshot((doc) => {
                if (doc.exists && doc.data().adminPass) {
                    adminPassHash = doc.data().adminPass;
                }
            });
        }

        function listenFirebaseUsers() {
            db.collection("usuarios").onSnapshot((snapshot) => {
                dbUsers = [];
                snapshot.forEach((doc) => {
                    dbUsers.push({ id: doc.id, ...doc.data() });
                });

                if (!dbUsers.some(u => u.email === 'vendedor@lifeapps.com.br')) {
                    db.collection("usuarios").add({
                        nome: "Vendedor Padrão",
                        email: "vendedor@lifeapps.com.br",
                        senha: "123",
                        status: "aprovado",
                        dataCriacao: new Date().toISOString()
                    });
                }
                checkRememberedUser();
            });
        }

        function checkRememberedUser() {
            const savedUserEmail = localStorage.getItem('sgp_user_email');
            const savedUserPass = localStorage.getItem('sgp_user_pass');

            if (savedUserEmail && savedUserPass) {
                const user = dbUsers.find(u => u.email === savedUserEmail && u.senha === savedUserPass);
                if (user && user.status === 'aprovado') {
                    sessionStorage.setItem('sgp_session_user', JSON.stringify(user));
                    window.location.href = 'feed.html';
                }
            }
        }

        function switchAuthTab(type) {
            document.getElementById('form-login-vendedor').classList.add('hidden');
            document.getElementById('form-login-admin').classList.add('hidden');
            document.getElementById('form-register-vendedor').classList.add('hidden');

            document.getElementById('auth-tab-vendedor').className = "flex-1 py-2 rounded-lg text-gray-500 hover:text-gray-900 transition";
            document.getElementById('auth-tab-admin').className = "flex-1 py-2 rounded-lg text-gray-500 hover:text-gray-900 transition";

            if (type === 'vendedor') {
                document.getElementById('form-login-vendedor').classList.remove('hidden');
                document.getElementById('auth-tab-vendedor').className = "flex-1 py-2 rounded-lg bg-white shadow text-blue-900 transition font-bold";
            } else {
                document.getElementById('form-login-admin').classList.remove('hidden');
                document.getElementById('auth-tab-admin').className = "flex-1 py-2 rounded-lg bg-white shadow text-blue-900 transition font-bold";
            }
        }

        function showRegisterScreen() {
            document.getElementById('form-login-vendedor').classList.add('hidden');
            document.getElementById('form-login-admin').classList.add('hidden');
            document.getElementById('form-register-vendedor').classList.remove('hidden');
        }

        function hideRegisterScreen() {
            switchAuthTab('vendedor');
        }

        function handleVendedorLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-vendedor-email').value.trim().toLowerCase();
            const pass = document.getElementById('login-vendedor-senha').value;
            const rememberMe = document.getElementById('remember-me').checked;

            let user = dbUsers.find(u => u.email === email && u.senha === pass);

            if (!user && email === 'vendedor@lifeapps.com.br' && pass === '123') {
                user = { id: 'vendedor_padrao', nome: "Vendedor Padrão", email: "vendedor@lifeapps.com.br", status: "aprovado", role: "vendedor" };
            }

            if (!user) {
                alert('E-mail ou senha inválidos!');
                return;
            }

            if (user.status !== 'aprovado') {
                alert('Seu cadastro foi realizado. Aguardando autorização da gestão para você acessar.');
                return;
            }

            if (rememberMe) {
                localStorage.setItem('sgp_user_email', email);
                localStorage.setItem('sgp_user_pass', pass);
            } else {
                localStorage.removeItem('sgp_user_email');
                localStorage.removeItem('sgp_user_pass');
            }

            user.role = 'vendedor';
            sessionStorage.setItem('sgp_session_user', JSON.stringify(user));
            window.location.href = 'feed.html';
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('login-admin-senha').value;

            if (pass === adminPassHash) {
                const adminUser = { id: 'admin_root', nome: "Administrador", email: "admin@lifeapps.com.br", role: "admin" };
                sessionStorage.setItem('sgp_session_user', JSON.stringify(adminUser));
                window.location.href = 'feed.html';
            } else {
                alert('Senha de administrador incorreta!');
            }
        }

        function handleVendedorRegister(e) {
            e.preventDefault();
            const nome = document.getElementById('reg-nome').value.trim();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const senha = document.getElementById('reg-senha').value;
            const confirm = document.getElementById('reg-senha-confirm').value;

            if (!email.endsWith('@lifeapps.com.br')) {
                alert('Por favor, utilize seu e-mail corporativo finalizado em @lifeapps.com.br');
                return;
            }

            if (senha !== confirm) {
                alert('As senhas digitadas não coincidem!');
                return;
            }

            const exists = dbUsers.some(u => u.email === email);
            if (exists) {
                alert('Este e-mail corporativo já possui conta cadastrada!');
                return;
            }

            db.collection("usuarios").add({
                nome,
                email,
                senha,
                status: 'pendente',
                dataCriacao: new Date().toISOString()
            }).then(() => {
                alert('Seu cadastro foi realizado com sucesso!\nAguardando autorização da gestão para você acessar.');
                hideRegisterScreen();
            });
        }

        listenSystemSettings();
        listenFirebaseUsers();
    </script>
</body>
</html>
